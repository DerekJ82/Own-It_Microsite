// ══════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════
function goHome() {
  oiActiveWs = null;
  document.getElementById('view-landing').classList.add('active');
  document.getElementById('view-ws').classList.remove('active');
  document.getElementById('app-shell').scrollTop = 0;
}

function openWorkstream(idx) {
  oiActiveWs = idx;
  document.getElementById('view-landing').classList.remove('active');
  document.getElementById('view-ws').classList.add('active');

  // Set active nav tab
  [0,1,2,3,4].forEach(function(i) {
    var tab = document.getElementById('ws-tab-' + i);
    if (tab) tab.classList.toggle('active', i === idx);
  });

  // Render the deep-dive
  renderWorkstreamView(idx);
  document.getElementById('view-ws').scrollTop = 0;
}

// ══════════════════════════════════════════════════════════
// LANDING — build story tile grid
// ══════════════════════════════════════════════════════════
function buildTileGrid() {
  var grid = document.getElementById('tile-grid');
  var h = '';
  for (var i = 0; i < OI_WORKSTREAMS.length; i++) {
    h += buildStoryTile(i);
  }
  grid.innerHTML = h;
}

function buildStoryTile(idx) {
  var ws = OI_WORKSTREAMS[idx];
  var h = '';
  h += '<div class="story-tile" onclick="openWorkstream(' + idx + ')">';

  // Top row
  h += '<div class="tile-top-row">';
  h += '<div class="tile-badge">' + ws.num + '</div>';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div class="tile-title">' + ws.label + '</div>';
  h += '<div class="tile-subtitle">' + ws.subtitle + '</div>';
  h += '</div>';
  h += '<div class="tile-open-hint">Open <i class="fa-solid fa-chevron-right" style="font-size:0.5rem;"></i></div>';
  h += '</div>';

  // KPI boxes
  var cols = ws.kpis.length > 3 ? 2 : ws.kpis.length;
  h += '<div class="tile-kpi-grid" style="grid-template-columns:repeat(' + cols + ',1fr);">';
  for (var ki = 0; ki < ws.kpis.length; ki++) {
    var kpi = ws.kpis[ki];
    var valSize = kpi.value.length > 6 ? '0.9rem' : '1.05rem';
    h += '<div class="tile-kpi-box">';
    h += '<div class="tile-kpi-label">' + kpi.label + '</div>';
    h += '<div class="tile-kpi-value" style="font-size:' + valSize + ';">' + kpi.value + '</div>';
    if (kpi.sub) h += '<div class="tile-kpi-sub">' + kpi.sub + '</div>';
    h += '</div>';
  }
  h += '</div>';

  // Pills
  h += '<div class="tile-pills">';
  for (var pi = 0; pi < ws.pills.length; pi++) {
    h += '<span class="tile-pill">' + ws.pills[pi] + '</span>';
  }
  h += '</div>';

  // Bottom links
  if (ws.links && ws.links.length) {
    h += '<div class="tile-links">';
    for (var li = 0; li < ws.links.length; li++) {
      var lnk = ws.links[li];
      h += '<button class="tile-link-btn" onclick="event.stopPropagation();">';
      h += '<i class="fa-solid ' + lnk.icon + '" style="font-size:0.5rem;opacity:0.8;"></i>' + lnk.label;
      h += '</button>';
    }
    h += '</div>';
  }

  h += '</div>';
  return h;
}

// ══════════════════════════════════════════════════════════
// WORKSTREAM DEEP-DIVE — chapter header + section tabs
// ══════════════════════════════════════════════════════════
function renderWorkstreamView(idx) {
  var ws  = OI_WORKSTREAMS[idx];
  var numStr = ws.num;
  var h = '';

  // Full-page wrapper
  h += '<div class="ws-content-wrap">';

  // Chapter header card
  h += '<div class="ws-chapter-card">';
  h += '<div style="display:flex;align-items:flex-start;gap:28px;margin-bottom:32px;">';
  h += '<div class="ws-chapter-ghost-num">' + numStr + '</div>';
  h += '<div style="flex:1;">';
  h += '<div class="ws-chapter-eyebrow">' + ws.subtitle + '</div>';
  h += '<div class="ws-chapter-title">' + ws.label + '</div>';
  h += '<div class="ws-chapter-narrative">' + ws.narrative + '</div>';
  h += '</div>';
  h += '</div>';

  // KPI row
  var gridCols = ws.kpis.length > 3 ? 4 : ws.kpis.length;
  h += '<div class="ws-kpi-row" style="grid-template-columns:repeat(' + gridCols + ',1fr);">';
  for (var ki = 0; ki < ws.kpis.length; ki++) {
    var kpi = ws.kpis[ki];
    h += '<div class="ws-kpi-box">';
    h += '<div class="ws-kpi-box-label">' + kpi.label + '</div>';
    h += '<div class="ws-kpi-box-value">' + kpi.value + '</div>';
    if (kpi.sub) h += '<div class="ws-kpi-box-sub">' + kpi.sub + '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</div>'; // /chapter card

  // Section tab buttons
  var activeSec = oiActiveSection[idx] || ws.sections[0].id;
  h += '<div class="ws-section-tabs" id="ws-tabs-' + idx + '">';
  for (var si = 0; si < ws.sections.length; si++) {
    var sec = ws.sections[si];
    var isActive = sec.id === activeSec;
    h += '<button class="ws-section-tab' + (isActive ? ' active' : '') + '" ';
    h += 'onclick="setWsSection(' + idx + ',\'' + sec.id + '\')">';
    h += '<i class="fa-solid ' + sec.icon + '" style="margin-right:5px;font-size:0.7em;opacity:0.8;"></i>' + sec.label;
    h += '</button>';
  }
  h += '</div>';

  // Section content
  h += '<div id="ws-section-' + idx + '">';
  h += renderWsSection(idx, activeSec);
  h += '</div>';

  // Hub links bar
  if (ws.links && ws.links.length) {
    h += '<div class="ws-hub-bar">';
    h += '<div class="ws-hub-bar-label">Related</div>';
    for (var li = 0; li < ws.links.length; li++) {
      var lnk = ws.links[li];
      h += '<button class="ws-hub-link">';
      h += '<i class="fa-solid ' + lnk.icon + '" style="font-size:0.58rem;opacity:0.8;"></i>';
      h += lnk.label;
      h += '<i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.44rem;opacity:0.4;margin-left:2px;"></i>';
      h += '</button>';
    }
    h += '</div>';
  }

  h += '</div>'; // /content-wrap
  document.getElementById('ws-body').innerHTML = h;
}

function setWsSection(idx, sectionId) {
  oiActiveSection[idx] = sectionId;
  var ws = OI_WORKSTREAMS[idx];

  // Update tab active states
  var tabs = document.querySelectorAll('#ws-tabs-' + idx + ' .ws-section-tab');
  for (var ti = 0; ti < tabs.length; ti++) {
    tabs[ti].classList.toggle('active', ws.sections[ti].id === sectionId);
  }

  // Render section
  document.getElementById('ws-section-' + idx).innerHTML = renderWsSection(idx, sectionId);
}

// ══════════════════════════════════════════════════════════
// SECTION CONTENT RENDERERS
// Each workstream section falls into a type: process-map,
// root-cause (editable), or data (placeholder / loaded).
// ══════════════════════════════════════════════════════════
function renderWsSection(idx, sectionId) {
  var ws  = OI_WORKSTREAMS[idx];

  // Find section definition
  var secDef = null;
  for (var i = 0; i < ws.sections.length; i++) {
    if (ws.sections[i].id === sectionId) { secDef = ws.sections[i]; break; }
  }
  if (!secDef) return '';

  var h = '<div class="ws-section-card">';
  h += '<div class="ws-section-header">';
  h += '<i class="fa-solid ' + secDef.icon + '" style="color:#4b286d;font-size:1rem;"></i>';
  h += '<span class="ws-section-title">' + ws.label + ' &mdash; ' + secDef.label + '</span>';
  h += '</div>';

  // ── Root Cause Challenges: editable textarea ──
  if (sectionId === 'root-cause') {
    h += '<p style="font-size:0.78rem;color:#6b7280;margin:0 0 12px;line-height:1.6;">';
    h += 'Document root cause challenges and findings here as they are identified during the workshop. ';
    h += 'This content is saved to the master workbook and visible to all attendees with access.';
    h += '</p>';
    h += '<textarea class="editable-notes" id="notes-' + idx + '" ';
    h += 'placeholder="e.g. Current pricing models lack SG&amp;A, making comparisons to competitors misleading...">';
    h += '</textarea>';
    h += '<div style="display:flex;align-items:center;gap:12px;margin-top:10px;">';
    h += '<button class="save-btn" onclick="saveRootCause(' + idx + ')">Save Notes</button>';
    h += '<span id="save-status-' + idx + '" style="font-size:0.7rem;color:#6b7280;"></span>';
    h += '</div>';
    // Load existing notes
    loadRootCauseNotes(idx);
  }

  // ── Process Map: image or placeholder ──
  else if (sectionId === 'process-map') {
    h += '<div id="process-map-content-' + idx + '" class="ws-spinner">';
    h += '<i class="fa-solid fa-spinner fa-spin"></i>';
    h += 'Load the process map image or diagram for this workstream here.';
    h += '</div>';
  }

  // ── All other sections: data placeholder ──
  else {
    h += '<div style="text-align:center;padding:48px 24px;color:#9ca3af;">';
    h += '<i class="fa-solid fa-database" style="font-size:2.2rem;margin-bottom:16px;display:block;color:#e5e7eb;"></i>';
    h += '<div style="font-size:0.82rem;font-weight:700;color:#4b286d;margin-bottom:8px;">' + secDef.label + '</div>';
    h += '<div style="font-size:0.75rem;line-height:1.6;max-width:480px;margin:0 auto;">';
    h += 'Data for this section will be populated as the workshop progresses. ';
    h += 'Connect the Google Sheet tab to the <code>getWorkstream' + (idx + 1) + 'Data()</code> server function.';
    h += '</div>';
    h += '</div>';
  }

  h += '</div>'; // /ws-section-card
  return h;
}

// ══════════════════════════════════════════════════════════
// ROOT CAUSE NOTES — load & save via google.script.run
// ══════════════════════════════════════════════════════════
function loadRootCauseNotes(idx) {
  google.script.run
    .withSuccessHandler(function(result) {
      try {
        var ta = document.getElementById('notes-' + idx);
        if (ta && result && result.notes) ta.value = result.notes;
      } catch(e) { console.error(e); }
    })
    .withFailureHandler(function() {})
    .getWorkstreamNotes(idx + 1);
}

function saveRootCause(idx) {
  var ta = document.getElementById('notes-' + idx);
  if (!ta) return;
  var statusEl = document.getElementById('save-status-' + idx);
  if (statusEl) statusEl.textContent = 'Saving...';
  google.script.run
    .withSuccessHandler(function(result) {
      try {
        var st = document.getElementById('save-status-' + idx);
        if (st) st.textContent = result && result.success ? 'Saved.' : 'Save failed.';
        setTimeout(function() {
          var st2 = document.getElementById('save-status-' + idx);
          if (st2) st2.textContent = '';
        }, 3000);
      } catch(e) { console.error(e); }
    })
    .withFailureHandler(function(err) {
      try {
        var st = document.getElementById('save-status-' + idx);
        if (st) st.textContent = 'Error: ' + (err ? err.message : 'Unknown');
      } catch(e) {}
    })
    .saveWorkstreamNotes(idx + 1, ta.value);
}
